appId: org.community.smp.launcher
productName: MineSPbSO
directories:
  output: release
  app: dist/app
files:
  - '**/*'
  - '!node_modules/**'
extraResources:
  - from: dist/launcher-config.json
    to: launcher-config.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: MineSPbSO-${version}-Setup.${ext}
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: scripts/uninstall.nsh
  oneClick: false
  perMachine: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish: null
