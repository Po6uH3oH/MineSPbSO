services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: smp
      POSTGRES_USER: smp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U smp -d smp]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - 127.0.0.1:8025:8025
    restart: unless-stopped
  accounts:
    build: .
    env_file: .env
    environment:
      ADMIN_PANEL_CONTAINER: "true"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:3011:3011
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  db-data:
